<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Night Float</title>
<meta name="theme-color" content="#0b1226">
<style>
:root{--bg:#070c1a;--ink:#eaf0ff;--dim:#a3afd4;--line:rgba(160,178,255,.28);--card:rgba(10,15,34,.82);--glow:#ffd27a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#top{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;pointer-events:none}
#top>*{pointer-events:auto}
#lake{flex:1;min-width:0;font-size:14px;color:var(--dim);text-shadow:0 1px 8px #000}
#lake b{color:var(--ink);font-weight:600}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin-left:6px;font-size:12px;color:var(--ink);background:rgba(10,15,34,.5)}
.tb{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 11px;font-size:13px;backdrop-filter:blur(4px)}
.tb:hover{border-color:#6b7bd0}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom));pointer-events:none}
#bar>*{pointer-events:auto}
#hint{max-width:min(560px,100%);text-align:center;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px;backdrop-filter:blur(4px)}
#power{width:min(360px,80%);height:12px;border:1px solid var(--line);border-radius:999px;background:rgba(10,15,34,.7);overflow:hidden;display:none;position:relative}
#power i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5bd6c4,#ffd27a)}
#power b{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
#pzone{font-size:13px;color:var(--ink);min-height:1.2em;text-shadow:0 1px 6px #000}
#act{min-width:min(280px,80%);padding:15px 26px;font-size:19px;font-weight:700;letter-spacing:.03em;border-radius:16px;border:2px solid var(--glow);background:rgba(255,210,122,.16);color:var(--glow);touch-action:none;backdrop-filter:blur(4px)}
#act[disabled]{border-color:var(--line);color:var(--dim);background:rgba(10,15,34,.6);cursor:default}
#act:active:not([disabled]){background:rgba(255,210,122,.36)}
#reel{font-size:13px}
#toast{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top));transform:translateX(-50%);max-width:92%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 16px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;backdrop-filter:blur(4px)}
#toast.on{opacity:1}
#joy{position:fixed;left:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:116px;height:116px;border-radius:50%;border:2px solid var(--line);background:rgba(10,15,34,.45);display:none;touch-action:none}
#joy i{position:absolute;left:33px;top:33px;width:50px;height:50px;border-radius:50%;background:rgba(160,178,255,.4);border:2px solid var(--line)}
@media (pointer:coarse){#joy{display:block}}
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 28px));max-height:calc(100% - 70px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 80px rgba(0,0,0,.55);backdrop-filter:blur(8px);user-select:text;-webkit-user-select:text}
.panel[hidden],#bar[hidden],#top .hh[hidden]{display:none}
.panel h1{margin:0 0 4px;font-size:32px;letter-spacing:.02em}
.panel h2{margin:0 0 6px;font-size:22px}
.panel p{margin:8px 0;color:var(--dim)}
.panel p b{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{flex:1 1 140px;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:rgba(30,40,80,.6);font-weight:600}
.btn:hover{border-color:#6b7bd0}
.btn.pri{border-color:var(--glow);background:rgba(255,210,122,.14);color:var(--glow)}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.entry{border:1px solid var(--line);border-radius:12px;padding:8px;font-size:13px;background:rgba(15,22,48,.6)}
.entry canvas{width:100%;height:70px;display:block;border-radius:8px;background:#060a18}
.entry b{display:block;margin-top:4px}
.entry.lock{color:var(--dim)}
.new{display:inline-block;border:1px solid var(--glow);color:var(--glow);border-radius:999px;padding:0 9px;font-size:12px;margin-left:6px;vertical-align:middle}
#rcv{width:100%;height:150px;display:block;border-radius:12px;background:radial-gradient(ellipse at 50% 60%,#14224a,#060914)}
kbd{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--dim)}
@media (max-width:520px){.panel{padding:18px 16px}#lake{font-size:13px}.chip{display:block;width:max-content;margin:2px 0 0}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<canvas id="gl" aria-label="A rowboat on a dark lake at dusk"></canvas>
<header id="top">
  <div id="lake"></div>
  <button class="tb hh" id="bLog" type="button" hidden>Logbook</button>
  <button class="tb hh" id="bHow" type="button" hidden>?</button>
  <button class="tb" id="bMusic" type="button" aria-pressed="true">Music on</button>
  <button class="tb" id="mute" type="button" aria-pressed="false">Sound on</button>
</header>
<div id="toast" role="status"></div>
<section id="bar" hidden>
  <div id="pzone"></div>
  <div id="power" aria-hidden="true"><i id="pfill"></i><b style="left:35%"></b><b style="left:70%"></b></div>
  <div id="hint"></div>
  <div style="display:flex;gap:8px;align-items:center"><button id="act" type="button">Row to a spot</button><button class="tb" id="reel" type="button" hidden>Reel in <kbd>R</kbd></button></div>
</section>
<div id="joy" aria-hidden="true"><i></i></div>
<div id="panel" class="panel" role="dialog" aria-live="polite"></div>
<audio id="bgm" loop preload="none" src="/audio/night-float-music.mp3"></audio>
<div id="live" class="sr" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/vendor/GLTFLoader.js"></script>

<script src="/vendor/Sky.js"></script>

<script>
(function(){
'use strict';

function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

var muted=!!lsGet('nf.muted',false);
var S={state:'menu',lake:null,spotMeshes:[],you:null,room:null,ws:null,wsOk:false,rigs:{},started:false,castSeq:0,tally:0,rainSrc:null,wasd:{},yawOff:0,zoom:9.5,target:null,power:0,charging:false,near:null,t:0,events:[],evI:0};
/* ---------- audio ---------- */
var AC=null,master=null,nbuf=null;
function ac(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.8;master.connect(AC.destination);

var SND={
  plop:function(){tone(320,90,.16,.22,0);nz('bandpass',1200,1,.25,.05,0,300)},
  tick:function(pan,v){tone(1500,900,.035,v||.05,pan)},
  swirl:function(pan,size,v){var f=[900,650,380,170][size];nz('bandpass',f,2.5,.7+size*.3,v||.12,pan,f*.45)},

function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}


/* ---------- 3D creatures (shaped after real fish) ---------- */
var FISH_LOOK={
  glimmerling:'minnow',dawdler:'flounder',skimray:'ray',ribbonjaw:'pike',gulper:'bass',hollowking:'catfish'};
function sstep(a,b,x){x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)}

    var Y=y*o.H*pr*(y<0?(o.belly==null?1:o.belly):1),Z=z*o.W*(o.wprof?o.wprof(u):pr),X=x*o.L/2;
    p.setXYZ(i,X,Y+(o.lift||0)*pr,Z);base[i*3]=X;base[i*3+1]=Y+(o.lift||0)*pr;base[i*3+2]=Z;meta[i]=u;

function finShape(pts,color,op){

function eyeBall(r,iris,glow){var g=new T.Group(),w=new T.Mesh(new T.SphereGeometry(r,14,12),glow?new T.MeshBasicMaterial({color:glow}):new T.MeshStandardMaterial({color:iris||0xf2e6b0,roughness:.2}));g.add(w);

function mix(c,a,b,t){c.setRGB(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t)}

var PROF={
  fus:function(u){return Math.pow(Math.sin(Math.PI*Math.pow(u,.8)),.75)},
  slim:function(u){return Math.pow(Math.sin(Math.PI*Math.pow(u,.7)),.6)},

    var d=new T.Mesh(new T.SphereGeometry(.018,8,6),new T.MeshBasicMaterial({color:0xbdfff7}));

    [-1,1].forEach(function(s){var e=eyeBall(.032);e.position.set(.38,.03,s*.075);g.add(e)})}
  else if(id==='dawdler'){L=.95;var top=hex3(0x7d7a4d),dark=hex3(0x3a3a24),pale=hex3(0xd9d2b2);

  else if(id==='skimray'){L=1.1;var top2=hex3(0x8e83d6),spot=hex3(0xe9e4ff),under=hex3(0xf3f0ff);
    body=bodyMesh({L:L,H:.09,W:.62,prof:function(u){return Math.pow(Math.sin(Math.PI*Math.pow(u,.85)),.5)},wprof:function(u){return Math.pow(Math.sin(Math.PI*Math.pow(u,.9)),.9)},belly:.5,rough:.5,metal:.12,color:function(c,u,y,a,z){var s=Math.sin(u*24)*Math.sin(z*19);mix(c,y>0?top2:under,spot,y>0&&s>.7?.9:0)}});
    g.add(body);tail=new T.Group();tail.position.x=-L/2+.05;var tl=new T.Mesh(new T.CylinderGeometry(.004,.022,.9,6),new T.MeshStandardMaterial({color:0x6c62b8,roughness:.6}));tl.rotation.z=Math.PI/2;tl.position.x=-.45;tail.add(tl);g.add(tail);

    tail=new T.Group();tail.position.x=-L/2;tail.add(finShape([0,0,-.24,.17,-.17,0,-.24,-.17],0x7a8a4a));g.add(tail);
    g.add(finShape([-.62,.1,-.8,.2,-.9,.1],0x7a8a4a));g.add(finShape([-.62,-.1,-.8,-.2,-.9,-.1],0x7a8a4a));
    [-1,1].forEach(function(s){var e=eyeBall(.026,0xf5d04a);e.position.set(L/2-.32,.04,s*.062);g.add(e)})}
  else if(id==='gulper'){L=1.15;var bk2=hex3(0x6c7d3a),fl=hex3(0xc9b76a),bl=hex3(0xf1e9c4),band=hex3(0x2c3a1a);
    body=bodyMesh({L:L,H:.3,W:.17,prof:PROF.deep,color:function(c,u,y,a){mix(c,bk2,bl,sstep(-.2,.55,-y));if(Math.abs(y+.02)<.14&&u>.12&&u<.92)mix(c,[c.r,c.g,c.b],band,.75);}});
    g.add(body);var mouth=new T.Mesh(new T.SphereGeometry(.14,16,12),new T.MeshStandardMaterial({color:0x1c0a0c,roughness:.9}));mouth.scale.set(.3,.5,.75);mouth.position.set(L/2-.13,-.05,0);g.add(mouth);
    var lj=new T.Mesh(new T.SphereGeometry(.16,14,10,0,Math.PI*2,Math.PI/2,Math.PI/2),new T.MeshStandardMaterial({color:0xcbbf88,roughness:.5}));lj.scale.set(1.1,.7,.9);lj.rotation.z=.25;lj.position.set(L/2-.12,-.12,0);lj.scale.set(.8,.5,.7);g.add(lj);
    tail=new T.Group();tail.position.x=-L/2;tail.add(finShape([0,0,-.22,.17,-.19,0,-.22,-.17],0x7a8844));g.add(tail);
    g.add(finShape([.18,.27,.0,.4,-.08,.3,-.18,.38,-.26,.2],0x667436));g.add(finShape([-.3,.18,-.42,.3,-.52,.14],0x7a8844));
    [-1,1].forEach(function(s){var e=eyeBall(.045,0xf0d060);e.position.set(.34,.09,s*.12);g.add(e)})}
  else if(id==='hollowking'){L=2.1;var bk3=hex3(0x1c1d44),bl3=hex3(0x8c88c9),mot=hex3(0x35346b);
    body=bodyMesh({L:L,H:.34,W:.3,prof:function(u){return Math.pow(Math.sin(Math.PI*Math.pow(u,.62)),.55)},wprof:function(u){return(.55+.75*sstep(.4,.95,u))*Math.pow(Math.sin(Math.PI*Math.pow(u,.62)),.5)},belly:.65,rough:.5,metal:.18,emissive:0x07071a,color:function(c,u,y,a,z){mix(c,bk3,bl3,sstep(-.1,.7,-y));var s=Math.sin(u*18)*Math.sin(a*4+u*5);if(s>.5&&y>-.2)mix(c,[c.r,c.g,c.b],mot,.7)}});
    g.add(body);

function releaseCast(){
  var m=S.me;if(m.phase!=='charge')return;S.charging=false;$('power').style.display='none';$('pzone').textContent='';
  if(S.power<.04){m.phase='none';m.land=null;toast('Hold a little longer to cast.');return}
  var lp=landPoint(S.power),seed=(Math.random()*4294967295)>>>0,spot=S.near,data=NF.rollCast(NF.makeRng(seed),spot,lp.dist,S.lake.condition);
  startCast(m,data,{x:lp.x,z:lp.z},m.h);S.t=0;buzz(20);
  netSend({t:'cast',c:{spot:spot.id,dist:lp.dist,ang:m.h,seed:seed,x:lp.x,z:lp.z}});updateAct()}
function reelIn(silent){var m=S.me;if(m.phase==='none')return;if(m.phase==='charge'){S.charging=false;$('power').style.display='none';$('pzone').textContent=''}endCast(m);m.land=null;S.events=[];netSend({t:'reel'});if(!silent)toast('Reeled in.');updateAct()}
function strike(){
  var m=S.me;if(m.phase!=='out'||S.state!=='play')return;if(m.t<NF.SETTLE)return;
  var res=NF.resolveStrike(m.cast,m.t);SND.splash(0,res.outcome==='landed'?2:0);buzz(res.outcome==='landed'?[40,40,90]:30);ripple(m.fl.position.x,m.fl.position.z,3,.6);
  if(res.outcome==='landed'||res.outcome==='junk'){S.state='reveal';S.events=[];hidePanel();reveal(res.enc,res.outcome==='landed')}
  else{S.events=[];toast(res.outcome==='early'?'Too early. The bait was pulled away.':'Too late. The bait is gone.');reelIn(true)}
  updateAct()}
function reveal(enc,isFish){
  var def=NF.CREATURES[enc.id]||NF.OBJECTS[enc.id],isNew=false,title,m=S.me,fp=m.fl.position.clone();
  if(isFish){var lg=logGet();isNew=!lg[enc.id];lg[enc.id]={n:((lg[enc.id]||{}).n||0)+1};lsSet('nf.log',lg);S.tally++;title='You caught a '+def.name+'.'}
  else title='Junk: '+def.name.toLowerCase()+'.';
  netSend({t:'catch',what:enc.id});endCast(m);m.land=null;
  var fg=buildFish(enc.id),sc=isFish?(enc.id==='hollowking'?1.3:1.1):1;fg.scale.setScalar(sc);scene.add(fg);S.jump={g:fg,t:0,from:fp,to:new T.Vector3(m.x,1.3,m.z),enc:enc,isFish:isFish,title:title,isNew:isNew,def:def,sc:sc};
  updateAct()}
function jumpStep(dt,time){
  var j=S.jump;if(!j)return;j.t+=dt;var u=Math.min(1,j.t/1.25);
  var x=j.from.x+(j.to.x-j.from.x)*u,z=j.from.z+(j.to.z-j.from.z)*u,y=j.from.y+(j.to.y-j.from.y)*u+Math.sin(Math.PI*u)*2.2;
  j.g.position.set(x,y,z);j.g.rotation.set(0,Math.atan2(j.to.x-j.from.x,j.to.z-j.from.z)-Math.PI/2+Math.sin(time*9)*.15,Math.sin(u*Math.PI*2)*.5*(1-u));swimFish(j.g,time*2.4);
  if(j.t<.1){ripple(j.from.x,j.from.z,3,.6);SND.splash(0,2)}
  if(u>=1){scene.remove(j.g);S.jump=null;ripple(j.to.x,j.to.z,2.4,.5);showCatch(j)}}
function showCatch(j){
  var enc=j.enc,def=j.def,isFish=j.isFish;
  showPanel('<div id="rcvWrap" style="width:100%;height:170px;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#14224a,#060914)"></div><h2 style="margin-top:12px">'+esc(j.title)+(j.isNew?'<span class="new">New in logbook</span>':'')+'</h2><p>'+esc(def.sig)+(isFish?' '+esc(def.tip):'')+'</p>'
    +(isFish?'<p style="font-size:13px">Caught tonight: '+S.tally+'. Found at: '+esc(NF.ZONES[def.zone])+'.</p>':'')+'<div class="row"><button class="btn pri" id="rvOk" type="button">Keep fishing</button></div>');
  var M=mini(),wrap=$('rcvWrap'),w=wrap.clientWidth||400;miniSize(w,170);M.r.domElement.style.cssText='width:100%;height:100%;display:block';wrap.appendChild(M.r.domElement);var g=miniShow(enc.id),t0=performance.now();
  (function anim(){if(S.state!=='reveal'||!document.body.contains(wrap))return;var t=(performance.now()-t0)/1000;g.rotation.y=-.6+Math.sin(t*.7)*.9;swimFish(g,t*2);M.r.render(M.sc,M.cm);requestAnimationFrame(anim)})();
  $('rvOk').onclick=function(){S.state='play';hidePanel();updateAct()}}

/* ---------- network ---------- */
function netSend(o){if(S.ws&&S.ws.readyState===1)try{S.ws.send(JSON.stringify(o))}catch(e){}}
function addRemote(p){if(S.rigs[p.id])return;var r=makeRig(p.color,p.name,false);r.x=r.tx=p.x;r.z=r.tz=p.z;r.h=r.th=p.h;S.rigs[p.id]=r;if(p.cast)remoteCast(r,p.cast,true);lakeUI()}
function remoteCast(r,c,skipFly){
  var sp=S.lake&&S.lake.spots.filter(function(s){return s.id===c.spot})[0];if(!sp&&S.lake)sp=null;
  var data=NF.rollCast(NF.makeRng(c.seed>>>0),sp,c.dist,S.lake.condition);startCast(r,data,{x:c.x==null?r.x:c.x,z:c.z==null?r.z:c.z},c.ang);if(skipFly){r.ft=1;r.rodA=.62}}
function netConnect(){
  var proto=location.protocol==='https:'?'wss://':'ws://',ws;
  try{ws=new WebSocket(proto+location.host+'/nfws')}catch(e){return}
  S.ws=ws;
  ws.onmessage=function(ev){var m;try{m=JSON.parse(ev.data)}catch(e){return}
    try{
    if(m.t==='init'){S.wsOk=true;S.you=m.you;S.room=m.room;if(!S.lake||S.lake.seed!==m.seed)applyLake(m.seed);
      m.players.forEach(function(p){if(p.id===m.you){S.me.color=p.color;if(S.me.char)S.me.char.root.traverse(function(o){if(o.isSkinnedMesh)o.material.color.set(p.color)})}else addRemote(p)});
      var tc=S.me.flTip.material.color;tc.lerp(new T.Color(S.me.color),.25);if(S.state==='menu')showMenu()}
    else if(m.t==='join'){addRemote(m.p);toast(m.p.name+' joined the lake.')}
    else if(m.t==='leave'){var r=S.rigs[m.id];if(r){scene.remove(r.g);scene.remove(r.fl);scene.remove(r.line);delete S.rigs[m.id];lakeUI()}}
    else if(m.t==='s'){m.p.forEach(function(q){var r=S.rigs[q[0]];if(r){r.tx=q[1];r.tz=q[2];r.th=q[3]}})}
    else if(m.t==='cast'){var r2=S.rigs[m.id];if(r2)remoteCast(r2,m.c)}
    else if(m.t==='reel'){var r3=S.rigs[m.id];if(r3)endCast(r3)}
    else if(m.t==='catch'){var r4=S.rigs[m.id];if(r4){endCast(r4);var d=NF.CREATURES[m.what]||NF.OBJECTS[m.what];if(d)toast(r4.name+(NF.CREATURES[m.what]?' caught a ':' hauled up ')+(NF.CREATURES[m.what]?d.name:d.name.toLowerCase())+'.')}}
    }catch(e){console.error('net',e)}};
  ws.onclose=function(){S.wsOk=false;if(S.state==='menu'&&!panel.hidden)showMenu()};
  ws.onerror=function(){}}
var poseAt=0,poseKey='';
function netPose(now){if(now-poseAt<120||!S.wsOk)return;poseAt=now;var m=S.me,k=m.x.toFixed(2)+m.z.toFixed(2)+m.h.toFixed(2);if(k===poseKey)return;poseKey=k;netSend({t:'pose',x:m.x,z:m.z,h:m.h})}

/* ---------- input ---------- */
var drag=null;
cv.addEventListener('pointerdown',function(e){drag={x:e.clientX,y:e.clientY,yo:S.yawOff,moved:false,id:e.pointerId};try{cv.setPointerCapture(e.pointerId)}catch(x){}});
cv.addEventListener('pointermove',function(e){if(!drag||drag.id!==e.pointerId)return;var dx=e.clientX-drag.x;if(Math.abs(dx)>6||Math.abs(e.clientY-drag.y)>6)drag.moved=true;if(drag.moved)S.yawOff=Math.max(-1.9,Math.min(1.9,drag.yo-dx*.006))});
cv.addEventListener('pointerup',function(e){if(!drag)return;var d=drag;drag=null;if(d.moved||S.state!=='play')return;
  if(S.me.phase!=='none')return;
  var r=cv.getBoundingClientRect(),nx=((e.clientX-r.left)/r.width)*2-1,ny=-((e.clientY-r.top)/r.height)*2+1,rc=new T.Raycaster();rc.setFromCamera({x:nx,y:ny},cam);
  var o=rc.ray.origin,dir=rc.ray.direction;if(dir.y>=-.01)return;var t=-o.y/dir.y,x=o.x+dir.x*t,z=o.z+dir.z*t;
  if(Math.hypot(x,z)>R-2)return;
  var sp=S.lake.spots.filter(function(s){return Math.hypot(s.x-x,s.z-z)<5.2})[0];S.target=sp?{x:sp.x,z:sp.z}:{x:x,z:z};if(sp)toast('Rowing to '+sp.name+'.');ripple(x,z,2.4,.5)});
cv.addEventListener('wheel',function(e){e.preventDefault();S.zoom=Math.max(5,Math.min(16,S.zoom+e.deltaY*.01))},{passive:false});
act.addEventListener('pointerdown',function(e){e.preventDefault();var p=S.me.phase;if(p==='out')strike();else if(p==='none')startCharge()});
addEventListener('pointerup',function(){if(S.me.phase==='charge')releaseCast()});
$('reel').addEventListener('click',function(){reelIn()});
$('mute').addEventListener('click',function(e){muted=!muted;lsSet('nf.muted',muted);muteUI();if(e.detail>0)e.currentTarget.blur()});
$('bMusic').addEventListener('click',function(e){musicOn=!musicOn;lsSet('nf.music',musicOn);musicUI();if(S.started||!panel.hidden)musicPlay();if(e.detail>0)e.currentTarget.blur()});
$('bLog').addEventListener('click',function(){showLogbook(hidePanel)});$('bHow').addEventListener('click',function(){showHow(hidePanel)});
var KEYMAP={KeyW:'w',ArrowUp:'w',KeyS:'s',ArrowDown:'s',KeyA:'a',ArrowLeft:'a',KeyD:'d',ArrowRight:'d'};
addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.code==='Escape'&&!panel.hidden&&S.state==='play'){hidePanel();return}
  if(!panel.hidden&&S.state!=='play')return;
  var k=KEYMAP[e.code];if(k&&S.state==='play'){S.wasd[k]=true;if(e.code.indexOf('Arrow')===0)e.preventDefault();return}
  if(e.code==='Space'){if(e.target&&e.target.tagName==='BUTTON'&&e.target!==act)return;e.preventDefault();if(e.repeat)return;if(S.state!=='play')return;var p=S.me.phase;if(p==='out')strike();else if(p==='none')startCharge();return}
  if(e.code==='KeyR'&&S.state==='play'){reelIn();return}
  if(e.code==='KeyM'){$('bMusic').click();return}
  if(e.code==='KeyN'){$('mute').click();return}
  if(e.code==='KeyL'&&S.state==='play'){showLogbook(hidePanel);return}
  if((e.code==='KeyH'||e.key==='?')&&S.state==='play'){showHow(hidePanel)}});
addEventListener('keyup',function(e){var k=KEYMAP[e.code];if(k)S.wasd[k]=false;if(e.code==='Space'&&S.me.phase==='charge')releaseCast()});
addEventListener('blur',function(){S.wasd={}});
(function joystick(){var j=$('joy'),knob=j.firstElementChild,id=null;function mv(e){var r=j.getBoundingClientRect(),x=(e.clientX-(r.left+r.width/2))/(r.width/2),y=(e.clientY-(r.top+r.height/2))/(r.height/2),l=Math.hypot(x,y);if(l>1){x/=l;y/=l}S.joy={x:x,y:y};knob.style.transform='translate('+x*30+'px,'+y*30+'px)'}
  j.addEventListener('pointerdown',function(e){id=e.pointerId;j.setPointerCapture(id);mv(e);S.target=null});j.addEventListener('pointermove',function(e){if(id===e.pointerId)mv(e)});
  function up(e){if(id===e.pointerId){id=null;S.joy=null;knob.style.transform=''}}j.addEventListener('pointerup',up);j.addEventListener('pointercancel',up)})();

/* ambience: gentle lapping */
var lapSrc=null;function lapping(on){if(!AC)return;if(on&&!lapSrc){var s=AC.createBufferSource();s.buffer=nbuf;s.loop=true;var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=420;var v=AC.createGain();v.gain.value=.05;s.connect(f);f.connect(v);v.connect(master);s.start();lapSrc=s;S.lap=v}}

/* ---------- main loop ---------- */
var clock=new T.Clock(),time=0;
function frame(){
  requestAnimationFrame(frame);
  var dt=Math.min(.06,clock.getDelta());time+=dt;
  try{
    if(S.state==='play'||S.state==='reveal'){boatStep(dt)}
    var m=S.me;
    if(m.phase==='charge'){S.power=Math.min(1,S.power+dt/POWER_T);var lp=landPoint(S.power);m.land=lp;$('pfill').style.width=(S.power*100)+'%';
      var z=NF.zoneFor(lp.dist);$('pzone').textContent=NF.ZONES[z]+' ('+Math.round(lp.dist)+' m)';
      if(!S.preview){S.preview=new T.Mesh(rippleGeo,new T.MeshBasicMaterial({color:0xffe2a0,transparent:true,opacity:.7,depthWrite:false,side:T.DoubleSide,blending:T.AdditiveBlending,fog:false}));S.preview.rotation.x=-Math.PI/2;scene.add(S.preview)}
      S.preview.visible=true;var ps=.6+Math.sin(time*6)*.08;S.preview.scale.set(ps,ps,1);S.preview.position.set(lp.x,.05,lp.z)}
    else if(S.preview)S.preview.visible=false;
    if(m.phase==='out'){S.t=m.t;while(S.evI<S.events.length&&S.events[S.evI].t<=m.t){try{S.events[S.evI].f()}catch(e){}S.evI++}
      if(m.t>NF.castEndsAt(m.cast)+12&&!S.idleSaid){S.idleSaid=true;toast('Nothing more is biting. Reel in (R) and cast again.')}}else S.idleSaid=false;
    updateRig(m,dt,time);
    for(var id in S.rigs){var r=S.rigs[id],k=Math.min(1,dt*6),dx=r.tx-r.x,dz=r.tz-r.z;r.v=Math.hypot(dx,dz)/Math.max(dt,.016)*.9*Math.min(1,k);r.x+=dx*k;r.z+=dz*k;r.h+=Math.atan2(Math.sin(r.th-r.h),Math.cos(r.th-r.h))*k;if(r.v>5)r.v=0;updateRig(r,dt,time)}
    S.spotMeshes.forEach(function(s,i){var d=Math.hypot(cam.position.x-s.sp.x,cam.position.z-s.sp.z),here=S.near===s.sp&&S.state==='play';
      s.pr.forEach(function(p,j){var k=((time*.35+j*.5+i*.13)%1),sc=1.2+k*3.2;p.scale.set(sc,sc,1);p.material.opacity=(.5*(1-k))*(here?1.6:1)});var db=Math.hypot(S.me.x-s.sp.x,S.me.z-s.sp.z);s.lb.material.opacity=Math.max(0,Math.min(1,(75-d)/30))*Math.max(0,Math.min(1,(db-9)/6));s.lb.visible=s.lb.material.opacity>.02});
    updRipples(dt);updRain(dt);jumpStep(dt,time);if(rain&&rain.visible){rain.position.set(0,0,0)}
    water.material.uniforms.time.value+=dt*(S.lake&&S.lake.condition==='wind'?.9:.45);
    camStep(dt,time);if(rain&&rain.visible){}
    if(S.state==='play')updateAct();netPose(performance.now());
  }catch(e){console.error('frame',e);if(!S.errShown){S.errShown=true;try{toast('Error: '+(e&&e.message||e),8000)}catch(x){}}}
  renderer.render(scene,cam)}

muteUI();musicUI();
applyLake(NF.dailySeed());
camPos.set(S.me.x,3,S.me.z-9);
showMenu();netConnect();frame();

})();
</script>
