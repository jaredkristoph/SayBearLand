<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Night Float</title>
<meta name="theme-color" content="#0b1226">
<style>
:root{--bg:#070c1a;--ink:#eaf0ff;--dim:#a3afd4;--line:rgba(160,178,255,.28);--card:rgba(10,15,34,.82);--glow:#ffd27a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#top{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;pointer-events:none}
#top>*{pointer-events:auto}
#lake{flex:1;min-width:0;font-size:14px;color:var(--dim);text-shadow:0 1px 8px #000}
#lake b{color:var(--ink);font-weight:600}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin-left:6px;font-size:12px;color:var(--ink);background:rgba(10,15,34,.5)}
.tb{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 11px;font-size:13px;backdrop-filter:blur(4px)}
.tb:hover{border-color:#6b7bd0}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom));pointer-events:none}
#bar>*{pointer-events:auto}
#hint{max-width:min(560px,100%);text-align:center;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px;backdrop-filter:blur(4px)}
#power{width:min(360px,80%);height:12px;border:1px solid var(--line);border-radius:999px;background:rgba(10,15,34,.7);overflow:hidden;display:none;position:relative}
#power i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5bd6c4,#ffd27a)}
#power b{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
#pzone{font-size:13px;color:var(--ink);min-height:1.2em;text-shadow:0 1px 6px #000}
#act{min-width:min(280px,80%);padding:15px 26px;font-size:19px;font-weight:700;letter-spacing:.03em;border-radius:16px;border:2px solid var(--glow);background:rgba(255,210,122,.16);color:var(--glow);touch-action:none;backdrop-filter:blur(4px)}
#act[disabled]{border-color:var(--line);color:var(--dim);background:rgba(10,15,34,.6);cursor:default}
#act:active:not([disabled]){background:rgba(255,210,122,.36)}
#reel{font-size:13px}
#toast{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top));transform:translateX(-50%);max-width:92%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 16px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;backdrop-filter:blur(4px)}
#toast.on{opacity:1}
#joy{position:fixed;left:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:116px;height:116px;border-radius:50%;border:2px solid var(--line);background:rgba(10,15,34,.45);display:none;touch-action:none}
#joy i{position:absolute;left:33px;top:33px;width:50px;height:50px;border-radius:50%;background:rgba(160,178,255,.4);border:2px solid var(--line)}
@media (pointer:coarse){#joy{display:block}}
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 28px));max-height:calc(100% - 70px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 80px rgba(0,0,0,.55);backdrop-filter:blur(8px);user-select:text;-webkit-user-select:text}
.panel[hidden],#bar[hidden],#top .hh[hidden]{display:none}
.panel h1{margin:0 0 4px;font-size:32px;letter-spacing:.02em}
.panel h2{margin:0 0 6px;font-size:22px}
.panel p{margin:8px 0;color:var(--dim)}
.panel p b{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{flex:1 1 140px;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:rgba(30,40,80,.6);font-weight:600}
.btn:hover{border-color:#6b7bd0}
.btn.pri{border-color:var(--glow);background:rgba(255,210,122,.14);color:var(--glow)}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.entry{border:1px solid var(--line);border-radius:12px;padding:8px;font-size:13px;background:rgba(15,22,48,.6)}
.entry canvas{width:100%;height:70px;display:block;border-radius:8px;background:#060a18}
.entry b{display:block;margin-top:4px}
.entry.lock{color:var(--dim)}
.new{display:inline-block;border:1px solid var(--glow);color:var(--glow);border-radius:999px;padding:0 9px;font-size:12px;margin-left:6px;vertical-align:middle}
#rcv{width:100%;height:150px;display:block;border-radius:12px;background:radial-gradient(ellipse at 50% 60%,#14224a,#060914)}
kbd{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--dim)}
@media (max-width:520px){.panel{padding:18px 16px}#lake{font-size:13px}.chip{display:block;width:max-content;margin:2px 0 0}}
body.nohud #lake,body.nohud .tb:not(#bHud),body.nohud #bar,body.nohud #toast,body.nohud #joy,body.nohud #bSmoke{display:none!important}body.nohud #bHud{opacity:.35}body.nohud #bHud:hover,body.nohud #bHud:focus-visible{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

  <div id="lake"></div>

</header>

  <div id="pzone"></div>

  <div style="display:flex;gap:8px;align-items:center"><button id="act" type="button">Row to a spot</button><button class="tb" id="reel" type="button" hidden>Reel in <kbd>R</kbd></button></div>
</section>
<div id="joy" aria-hidden="true"><i></i></div>
<div id="panel" class="panel" role="dialog" aria-live="polite"></div>
<div id="live" class="sr" aria-live="polite"></div>

<script>

  glimmerling:'minnow',dawdler:'flounder',skimray:'ray',ribbonjaw:'pike',gulper:'bass',hollowking:'catfish'};

  var dt=Math.min(.06,clock.getDelta());time+=dt;
  try{
    if(S.qe.q)S.yawOff+=1.9*dt;if(S.qe.e)S.yawOff-=1.9*dt;
    if(S.state==='play'||S.state==='reveal'){boatStep(dt);walkStep(dt)}
    var m=S.me;
    if(m.phase==='charge'){S.power=Math.min(1,S.power+dt/POWER_T);var lp=landPoint(S.power);m.land=lp;$('pfill').style.width=(S.power*100)+'%';
      $('pzone').textContent=NF.HABS[NF.habitatAt(lp.x,lp.z)]+' ('+Math.round(lp.dist)+' m)';
      if(!S.preview){S.preview=new T.Mesh(rippleGeo,new T.MeshBasicMaterial({color:0xffe2a0,transparent:true,opacity:.7,depthWrite:false,side:T.DoubleSide,blending:T.AdditiveBlending,fog:false}));S.preview.rotation.x=-Math.PI/2;scene.add(S.preview)}
      S.preview.visible=true;var ps=.6+Math.sin(time*6)*.08;S.preview.scale.set(ps,ps,1);S.preview.position.set(lp.x,.05,lp.z)}
    else if(S.preview)S.preview.visible=false;
    if(m.phase==='out'){S.t=m.t;while(S.evI<S.events.length&&S.events[S.evI].t<=m.t){try{S.events[S.evI].f()}catch(e){}S.evI++}
      if(m.t>NF.castEndsAt(m.cast)+12&&!S.idleSaid){S.idleSaid=true;toast('Nothing more is biting. Reel in (R) and cast again.')}}else S.idleSaid=false;
    updateRig(m,dt,time);
    for(var id in S.rigs){var r=S.rigs[id],k=Math.min(1,dt*6),dx=r.tx-r.x,dz=r.tz-r.z;r.v=Math.hypot(dx,dz)/Math.max(dt,.016)*.9*Math.min(1,k);r.x+=dx*k;r.z+=dz*k;r.h+=Math.atan2(Math.sin(r.th-r.h),Math.cos(r.th-r.h))*k;if(r.v>5)r.v=0;
      if(r.mode){var ex=r.tpx-r.px,ez=r.tpz-r.pz;r.wv+=(Math.min(6,Math.hypot(ex,ez)/Math.max(dt,.016)*Math.min(1,k))-r.wv)*Math.min(1,dt*8);r.px+=ex*k;r.pz+=ez*k;r.ph+=wrapA(r.tph-r.ph)*k}
      updateRig(r,dt,time)}
    campStep(dt,time);updPuffs(dt);ambUpdate(dt);$('bSmoke').hidden=!(S.state==='play'&&S.mode>0);
    updRipples(dt);updRain(dt);jumpStep(dt,time);if(rain&&rain.visible){rain.position.set(0,0,0)}
    water.material.uniforms.time.value+=dt*(S.lake&&S.lake.condition==='wind'?.9:.45);
    camStep(dt,time);if(rain&&rain.visible){}
    if(S.state==='play')updateAct();netPose(performance.now());
  }catch(e){console.error('frame',e);if(!S.errShown){S.errShown=true;try{toast('Error: '+(e&&e.message||e),8000)}catch(x){}}}
  renderWorld(time)}

muteUI();glassUI();
applyLake(NF.dailySeed());
camPos.set(S.me.x,3,S.me.z-9);
showMenu();netConnect();frame();

})();
