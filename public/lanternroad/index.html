<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120e24">
<title>Lanternroad</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120e24;--p1:#1d1738;--p2:#2a2150;--ln:#4a3d88;--ink:#f3ecd6;--dim:#a89fc8;--gold:#ffd24a;--ember:#ff8a3c;--ok:#58c872;--bad:#e45a5a;--blue:#6fb2ff;
--f:'Pixelify Sans',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.25 var(--f);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#gl,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
.pnl{background:linear-gradient(#2a2150,#1d1738);border:2px solid var(--ln);box-shadow:0 0 0 2px #0b0818,inset 0 0 0 1px #5a4ca0;border-radius:4px}
#hudL{position:absolute;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));padding:6px 10px 7px;min-width:150px}
#hudL .k{font-size:11px;letter-spacing:.14em;color:var(--dim)}
#league{font-size:34px;font-weight:700;line-height:1;color:#fff4cf;text-shadow:0 2px 0 #0b0818}
#biome{font-size:13px;color:#cfc6ee;margin-top:2px}
.bar{height:7px;background:#0b0818;border:1px solid #3a2f70;margin-top:5px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--gold);width:0}
#clock{height:8px;background:linear-gradient(90deg,#f6d56a 0,#f6d56a 48%,#ff8a4a 56%,#2a2f78 62%,#2a2f78 90%,#ff8a4a 96%,#f6d56a 100%);border:1px solid #3a2f70;margin-top:6px;position:relative}
#clock b{position:absolute;top:-3px;width:3px;height:12px;background:#fff;box-shadow:0 0 0 1px #0b0818}
#tod{font-size:11px;color:var(--dim);margin-top:3px}
#hudR{position:absolute;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.res{padding:5px 10px;display:flex;gap:8px;align-items:center;font-size:17px;font-weight:600}
.ico{width:12px;height:12px;display:inline-block;image-rendering:pixelated}
.coin{background:var(--gold);border-radius:50%;box-shadow:inset -2px -2px 0 #c28a10,0 0 0 1px #0b0818}
.emb{background:var(--ember);transform:rotate(45deg) scale(.85);box-shadow:inset -2px -2px 0 #c2501a,0 0 0 1px #0b0818}
.sm{padding:5px 9px;font-size:13px}
#toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);pointer-events:none;text-align:center;width:min(92%,560px)}
#toast div{margin:6px auto;padding:7px 12px;display:inline-block;font-size:17px;animation:tin .25s ease-out,tout .5s 2.6s forwards;background:rgba(18,14,36,.86);border:2px solid var(--ln)}
#toast div.big{font-size:26px;font-weight:700;border-color:var(--gold);color:var(--gold);letter-spacing:.06em;animation:tin .35s ease-out,tout .6s 3.2s forwards}
@keyframes tin{from{transform:translateY(8px) scale(.9);opacity:0}to{transform:none;opacity:1}}@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
#panel{position:relative;padding:8px max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:linear-gradient(#17122e,#0f0b20);border-top:2px solid var(--ln);display:flex;flex-direction:column;gap:8px}
#party{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hc{padding:4px 5px 5px;position:relative;min-width:0}
.hc.empty{opacity:.4;display:flex;align-items:center;justify-content:center;min-height:62px;font-size:12px;color:var(--dim)}
.hc .rn{position:absolute;left:3px;top:2px;font-size:11px;color:var(--gold);z-index:2;text-shadow:0 1px 0 #000}
.hc .row{display:flex;gap:5px;align-items:center;margin-bottom:2px}
.hc .nm{font-size:12px;margin-top:1px}
.hc canvas{width:36px;height:31px;image-rendering:pixelated;background:#0b0818;border:1px solid #3a2f70;flex:none}
.hc .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .lv{font-size:11px;color:var(--dim)}
.hc .hp i{background:var(--ok)}
.hc .sk i{background:var(--blue)}
.hc .bar{height:5px;margin-top:3px}
.hc.dead{filter:grayscale(1) brightness(.7)}
#dock{display:flex;gap:6px;align-items:stretch}
#dock .flames{flex:1.25 1 0}#dock .br{flex:1 1 0}#dock .btn{flex:1 1 0}
.btn{border:2px solid var(--ln);background:linear-gradient(#3a2e72,#2a2150);box-shadow:0 0 0 2px #0b0818,inset 0 0 0 1px #6a5cb8;padding:8px 10px;border-radius:4px;font-weight:600;letter-spacing:.03em;min-height:42px}
.btn:active:not(:disabled){transform:translateY(1px);filter:brightness(1.15)}
.btn:disabled{opacity:.45;cursor:default}
.btn.go{border-color:#d8a43a;background:linear-gradient(#7a5a22,#4a3414);box-shadow:0 0 0 2px #0b0818,inset 0 0 0 1px #f0c860}
.btn.pri{border-color:#58c872;background:linear-gradient(#2c7a46,#1c4a2c);box-shadow:0 0 0 2px #0b0818,inset 0 0 0 1px #80e8a0}
.btn.flare{flex:1.2;border-color:#ff9a4a;background:linear-gradient(#a8481c,#5a2410);box-shadow:0 0 0 2px #0b0818,inset 0 0 0 1px #ffb070}
.btn.on{filter:brightness(1.25);outline:2px solid var(--gold)}
#dock .btn{flex:1;font-size:14px;padding:6px 4px;line-height:1.15}
#dock .btn small{display:block;font-size:10px;font-weight:400;color:#d8cfee}
.flames{display:flex;gap:6px;flex:1.4;align-items:center;justify-content:center;padding:4px 6px;border-radius:4px}
.fd{width:26px;height:26px;border-radius:50%;border:2px solid #0b0818;box-shadow:0 0 0 2px var(--ln);position:relative}
.fd.sel{box-shadow:0 0 0 2px var(--gold),0 0 10px 2px currentColor}
.fd.lock{filter:grayscale(1) brightness(.5)}
.fd[data-f=red]{background:#ff6a3a;color:#ff6a3a}.fd[data-f=blue]{background:#5aa8ff;color:#5aa8ff}.fd[data-f=green]{background:#6aff8a;color:#6aff8a}.fd[data-f=white]{background:#fff0d8;color:#fff0d8}
.br{display:flex;flex-direction:column;align-items:center;gap:2px;flex:.9}
.br .row{display:flex;gap:4px;align-items:center}
.br button{width:26px;height:26px;padding:0;min-height:0;font-size:16px;line-height:1}
.br span{font-size:11px;color:var(--dim)}
/* sheets */
.sheet{position:absolute;z-index:20;display:none;flex-direction:column}
#ev{left:50%;transform:translateX(-50%);bottom:calc(100% + 8px);width:min(94%,520px);padding:10px 12px}
#ev h3,.sheet h3{margin:0 0 4px;font-size:17px;color:var(--gold)}
#ev p{margin:2px 0 8px;font-size:14px;color:#e6dff8}
#ev .opts{display:flex;gap:6px;flex-wrap:wrap}#ev .opts .btn{flex:1;min-width:140px;font-size:14px}
#ev .tm{height:4px;background:#0b0818;margin-top:8px}#ev .tm i{display:block;height:100%;background:var(--blue)}
#camp{position:absolute;z-index:15;display:none;flex-direction:column;background:linear-gradient(#17122e,#0f0b20);border:2px solid var(--ln);overflow:hidden}
#camp .hd{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:2px solid var(--ln)}
#camp .hd b{flex:1;font-size:18px;color:var(--gold)}
#tabs{display:flex;gap:4px;padding:6px 8px 0;overflow-x:auto;flex:none}
#tabs button{flex:1;white-space:nowrap;padding:7px 8px;border:2px solid var(--ln);border-bottom:0;background:#1d1738;color:var(--dim);border-radius:4px 4px 0 0;font-size:13px}
#tabs button.on{background:#2a2150;color:var(--gold)}
#tabBody{flex:1;overflow-y:auto;padding:10px;background:#2a2150;border-top:2px solid var(--ln);-webkit-overflow-scrolling:touch}
.row2{display:flex;gap:8px;align-items:center;padding:8px;margin-bottom:6px;background:#1d1738;border:1px solid #3a2f70;border-radius:3px}
.row2 .t{flex:1;min-width:0}.row2 .t b{display:block;font-size:15px}.row2 .t span{font-size:12px;color:var(--dim)}
.row2 .btn{min-height:38px;padding:6px 10px;font-size:14px;white-space:nowrap}
.tag{font-size:11px;color:#0b0818;background:var(--gold);padding:1px 5px;border-radius:2px;margin-left:4px}
.tag.g{background:var(--ok)}
.sub{font-size:13px;color:var(--dim);margin:8px 0 4px;letter-spacing:.06em}
.pips{display:inline-flex;gap:2px;margin-left:4px}.pips i{width:8px;height:8px;background:#0b0818;border:1px solid #5a4ca0}.pips i.on{background:var(--gold)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.slot{padding:6px;text-align:left;min-height:54px;border:2px solid var(--ln);background:#1d1738;border-radius:3px}.slot.sel{border-color:var(--gold)}
.hsel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.hsel button{border:2px solid var(--ln);background:#1d1738;padding:3px;border-radius:3px}.hsel button.on{border-color:var(--gold)}.hsel canvas{width:42px;height:36px;image-rendering:pixelated;display:block}
#modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(6,4,16,.72);padding:12px}
#modal .box{width:min(520px,100%);max-height:88vh;overflow:auto;padding:14px}
#modal h2{margin:0 0 6px;color:var(--gold);font-size:22px}
#modal .ent{font-style:italic;color:#e6dff8;margin:6px 0;padding-left:10px;border-left:3px solid var(--ln)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.stats div{background:#1d1738;border:1px solid #3a2f70;padding:5px;text-align:center;font-size:12px;color:var(--dim)}.stats b{display:block;font-size:17px;color:var(--ink)}
#auth{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 70%,#3a2a68 0,#120e24 70%);padding:14px}
#auth .box{width:min(380px,100%);padding:18px}
#auth h1{margin:0;text-align:center;font-size:34px;color:#fff4cf;text-shadow:0 3px 0 #0b0818,0 0 18px #ff9a4a}
#auth p.tag2{text-align:center;color:var(--dim);margin:4px 0 14px;font-size:13px}
#auth label{display:block;font-size:12px;color:var(--dim);margin:8px 0 3px;letter-spacing:.08em}
input{width:100%;background:#0b0818;border:2px solid var(--ln);color:var(--ink);padding:10px;font:inherit;font-size:16px;border-radius:3px;outline:none}input:focus{border-color:var(--gold)}
#authErr{min-height:18px;color:var(--bad);font-size:13px;margin:8px 0 0}
.link{background:none;border:0;color:var(--blue);padding:8px;width:100%;text-decoration:underline;font-size:13px}
#boot{position:fixed;inset:0;z-index:70;background:#120e24;display:flex;align-items:center;justify-content:center;color:var(--dim);flex-direction:column;gap:8px}
#hideUi.hidden~*{}
body.camping #panel{display:none}
@media (max-aspect-ratio:11/10){body.camping #hudL{display:none}}
body.nohud #hudL,body.nohud #hudR,body.nohud #panel{display:none}
@media (min-aspect-ratio:11/10){
 #stage{position:absolute;inset:0}
 #app{display:block}
 #panel{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(660px,100%);background:linear-gradient(rgba(23,18,46,.72),rgba(15,11,32,.9));border:2px solid var(--ln);border-bottom:0;border-radius:6px 6px 0 0}
 #camp{right:0;top:0;bottom:0;width:min(430px,46vw);border-width:0 0 0 2px}
}
@media (max-aspect-ratio:11/10){
 #stage{flex:none;height:56vh}#panel{flex:1;justify-content:space-evenly}
 .hc canvas{width:50px;height:43px}.hc{padding:6px}.hc .nm{font-size:12px}.hc .bar{height:6px}#dock .btn{min-height:54px;font-size:15px}#dock .flames,#dock .br{min-height:54px}
 #dock{flex-wrap:wrap}#dock .flames,#dock .br{flex:1 1 40%}#dock .btn{flex:1 1 28%}
 .hc .nm{font-size:11px}
 #camp{left:0;right:0;bottom:0;height:56%;border-width:2px 0 0}
 body.camping #stage{height:44%}
}
</style>
</head>
<body>
<div id="boot"><div style="font-size:26px;color:#fff4cf">Lanternroad</div><div id="bootMsg">Lighting the lantern...</div></div>
<div id="app">
 <div id="stage">
  <canvas id="gl"></canvas><canvas id="fx"></canvas>
  <div id="hudL" class="pnl"><div class="k">LEAGUE</div><div id="league">0</div><div id="biome"></div>
   <div class="bar" title="Progress to the next Guardian"><i id="gbar"></i></div><div id="gtxt" style="font-size:11px;color:var(--dim);margin-top:2px"></div>
   <div id="clock"><b id="clk"></b></div><div id="tod"></div></div>
  <div id="hudR"><div class="res pnl"><span class="ico coin"></span><span id="gold">0</span></div><div class="res pnl"><span class="ico emb"></span><span id="emb">0</span></div>
   <button id="bSpeed" class="btn sm">x1</button><button id="bHide" class="btn sm">Hide</button></div>
  <div id="toast"></div>
 </div>
 <div id="panel">
  <div id="ev" class="sheet pnl"></div>
  <div id="party"></div>
  <div id="dock">
   <div class="flames pnl" id="flames"></div>
   <div class="br pnl" style="padding:3px 6px"><div class="row"><button class="btn" id="bDim">-</button><b id="bv">1</b><button class="btn" id="bUp">+</button></div><span id="bburn"></span></div>
   <button class="btn flare" id="bFlare">Flare<small id="fcost"></small></button>
   <button class="btn" id="bPol">Push on<small>at night</small></button>
   <button class="btn go" id="bCamp">Camp<small>menus</small></button>
  </div>
 </div>
 <div id="camp"><div class="hd"><b>Camp</b><span id="campRes" style="font-size:14px;color:var(--dim)"></span><button class="btn sm" id="bBreak">Break camp</button></div><div id="tabs"></div><div id="tabBody"></div></div>
</div>
<div id="modal"><div class="box pnl" id="mbox"></div></div>
<div id="auth"><div class="box pnl"><h1>Lanternroad</h1><p class="tag2">The last lantern. An old road. Do not let it go out.</p>
 <form id="af" autocomplete="on"><label>USERNAME</label><input id="au" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="20" placeholder="3 to 20 letters, numbers, _">
 <div id="nmRow" style="display:none"><label>DISPLAY NAME</label><input id="an" maxlength="24" placeholder="What the caravan calls you"></div>
 <label>PASSWORD</label><input id="ap" type="password" autocomplete="current-password" maxlength="72" placeholder="8 or more characters">
 <div id="authErr"></div><button class="btn pri" style="width:100%;margin-top:8px;font-size:17px" id="abtn" type="submit">Sign in</button></form>
 <button class="link" id="aswap">New here? Make an account</button>
 <p style="font-size:11px;color:var(--dim);text-align:center;margin:6px 0 0">Lanternroad has its own accounts. Your SayBearLand login does not work here.</p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/lanternroad/core.js"></script>
<script src="/lanternroad/art.js"></script>
<script src="/lanternroad/scene.js"></script>
<script src="/lanternroad/game.js"></script>
</body>
</html>
