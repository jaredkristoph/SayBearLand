<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SayBearLand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#171433;--panel:#0f0d24;--line:#3b3478;--text:#f3f0ff;--muted:#a9a3d6;--mint:#3ee6c4;--gold:#ffd166;--pink:#ff7eb6;--font:'Baloo 2','Trebuchet MS',system-ui,sans-serif}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;background:color-mix(in srgb,var(--panel) 88%,transparent);border:3px solid var(--line);border-radius:18px;padding:8px 14px;box-shadow:0 5px 0 #0b0a1c}
#brand{top:max(12px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;align-items:baseline;gap:10px}
#brand b{font-size:24px;font-weight:800;letter-spacing:1px;color:var(--mint)}
#brand span{font-size:13px;color:var(--muted)}
#wallet{top:max(12px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));font-weight:700;font-size:16px;display:flex;gap:10px;align-items:center}
#wallet i{font-style:normal;color:var(--gold)}
#wallet a{color:var(--mint);text-decoration:none}
#chat{left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 32px));font-size:14px;line-height:1.35;z-index:2}
#chat h2{margin:0 0 4px;font-size:12px;letter-spacing:1.5px;color:var(--muted);font-weight:700}
#log{display:flex;flex-direction:column;gap:2px;min-height:62px;max-height:120px;overflow:hidden;justify-content:flex-end}
#log div{overflow-wrap:anywhere}
#log em{font-style:normal;font-weight:700}
#msg{width:100%;box-sizing:border-box;margin-top:6px;font:600 14px var(--font);color:var(--text);background:#211d47;border:3px solid var(--line);border-radius:12px;padding:4px 10px}
#msg:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#wear{left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px)}
button.chip{font:700 14px var(--font);color:var(--text);background:#211d47;border:3px solid var(--line);border-radius:14px;padding:4px 12px;cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--mint);color:#0f1a17;border-color:#0b0a1c}
.sw{width:26px;height:26px;border-radius:50%;border:3px solid #0b0a1c;padding:0;cursor:pointer}
.sw[aria-pressed="true"]{outline:3px solid #fff}
#hint{top:max(66px,calc(env(safe-area-inset-top,0px) + 56px));left:max(16px,env(safe-area-inset-left,0px));font-size:13px;color:var(--muted);background:none;border:0;box-shadow:none;padding:0}
#cam{right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:3}
#prompt{left:50%;transform:translateX(-50%);bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 70px);font:800 17px var(--font);color:#0f1a17;background:var(--gold);border:3px solid #0b0a1c;cursor:pointer;z-index:3}
#prompt kbd{background:#0f0d24;color:var(--gold);border-radius:8px;padding:0 8px;margin-right:6px;font-family:inherit}
#board{inset:0;margin:auto;width:min(560px,calc(100vw - 32px));height:fit-content;max-height:calc(100vh - 140px);overflow:auto;z-index:4;padding:20px 22px;background:#f2e3c4;color:#3b3478;border-color:#7a5a2c}
#board h2{margin:0 0 12px;font-size:26px;letter-spacing:1px}
#board article{border-radius:12px;padding:10px 14px;margin-bottom:10px}
#board article.gold{background:#ffd166}#board article.mint{background:#9fe8d6;color:#0f4a3d}#board article.pink{background:#ffc2dd;color:#6b1f45}
#board h3{margin:0;font-size:20px}#board p{margin:2px 0 0;font-size:15px}#board small{display:block;margin-top:6px;opacity:.7}
#toast{top:max(70px,calc(env(safe-area-inset-top,0px) + 60px));left:50%;transform:translateX(-50%);color:var(--gold);font-weight:700;z-index:5}
#mail{background:var(--panel);inset:0;margin:auto;width:min(760px,calc(100vw - 24px));height:min(520px,calc(100vh - 120px));z-index:6;display:grid;grid-template-columns:240px minmax(0,1fr);gap:12px;padding:14px;overflow:hidden}
#mail h2{margin:0 0 8px;font-size:20px;color:var(--mint)}
#mailList{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
#mailList button{text-align:left;background:#211d47;border:3px solid var(--line);border-radius:12px;color:var(--text);font:600 14px var(--font);padding:6px 10px;cursor:pointer}
#mailList button.unread{border-color:var(--mint)}#mailList button.sel{background:#2a2147}
#mailList small{display:block;color:var(--muted)}
#mailRead{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:8px}
#mailRead h3{margin:0;font-size:22px}#mailRead p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.att{display:flex;align-items:center;gap:12px;padding:10px 12px;background:#2a2147;border:3px solid var(--gold);border-radius:14px}
.att b{color:var(--gold);font-size:20px}
.wide{width:100%}
#mail input,#mail textarea,#mail select{font:600 14px var(--font);color:var(--text);background:#211d47;border:3px solid var(--line);border-radius:10px;padding:4px 8px;width:100%;box-sizing:border-box}
#mail .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
#mailClose{position:absolute;top:8px;right:10px}
#badge{background:#ff4d6d;color:#fff;border-radius:10px;padding:0 6px;margin-left:4px;font-size:12px}
button.chip:disabled{opacity:.45;cursor:not-allowed}
.sw:disabled{opacity:.35;cursor:not-allowed}
#joy{left:max(24px,env(safe-area-inset-left,0px));bottom:max(90px,calc(env(safe-area-inset-bottom,0px) + 80px));width:120px;height:120px;border-radius:50%;padding:0;touch-action:none;z-index:3;display:none}
#joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:var(--mint);border:3px solid #0b0a1c}
@media (pointer:coarse){#joy{display:block}}
@media (max-width:700px){#mail{grid-template-columns:1fr;height:calc(100vh - 100px);overflow:auto}}
[hidden]{display:none!important}
@media (max-width:700px){#chat{display:none}#wear{bottom:max(12px,env(safe-area-inset-bottom,0px))}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="hud" id="brand"><b>SAYBEARLAND</b><span id="online">connecting...</span></div>
<div class="hud" id="wallet"><i id="coins">0 CC</i><button class="chip" id="mailBtn" type="button">Mail<span id="badge" hidden></span></button><a id="adminLink" href="/admin" hidden>Admin</a><button class="chip" id="out" type="button">Log out</button></div>
<div class="hud" id="hint">Move: W A S D. Turn the camera: Q and E. Press F at a desk to sit or at the board to read it. M for mail, Enter to chat.</div>
<div class="hud" id="chat"><h2>TEAM CHAT</h2><div id="log" aria-live="polite"></div><input id="msg" maxlength="200" placeholder="Press Enter to chat" aria-label="Chat message" autocomplete="off"></div>
<div class="hud" id="wear" role="group" aria-label="Costume and colour"></div>
<button class="hud" id="prompt" hidden></button>
<div class="hud" id="cam" aria-label="Camera"><button class="chip" id="qL" type="button" aria-label="Turn camera left">Q &#8634;</button><button class="chip" id="eR" type="button" aria-label="Turn camera right">&#8635; E</button></div>
<div class="hud" id="board" hidden role="dialog" aria-label="Announcements"><h2>ANNOUNCEMENTS</h2><div id="boardItems"></div><small>Press F or Esc to close.</small></div>
<div class="hud" id="toast" hidden></div>
<div class="hud" id="joy" aria-label="Move"><i id="joyKnob"></i></div>
<div class="hud" id="mail" hidden role="dialog" aria-label="Mail">
  <div style="display:flex;flex-direction:column;min-height:0"><h2>MAIL</h2><div id="mailList"></div><div class="row" style="display:flex;gap:6px;margin-top:8px"><button class="chip" id="mailWrite" type="button">Write</button></div></div>
  <div id="mailRead"></div>
  <button class="chip" id="mailClose" type="button" aria-label="Close mail">Close</button>
</div>

<script src="/layout.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var T=THREE,L=CLLayout;
function J(url,opt){return fetch(url,Object.assign({credentials:'same-origin'},opt||{})).then(function(r){if(r.status===401){location.href='/';throw new Error('auth')}return r.json()})}
document.getElementById('out').onclick=function(){fetch('/api/logout',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:'{}'}).then(function(){location.href='/'})};
Promise.all([J('/api/me'),J('/api/layout'),J('/api/announcements'),J('/api/logo'),J('/api/bots')]).then(function(r){start(r[0].user,r[1].layout,r[2].items,r[3].dataUrl)}).catch(function(e){if(e.message!=='auth')document.getElementById('online').textContent='Could not load. Refresh to retry.'});

function start(ME,layout,news,logoUrl){
var lw=L.toWorld(layout);
var $=function(i){return document.getElementById(i)};
$('coins').textContent=(ME.coins||0)+' CC';if(ME.admin)$('adminLink').hidden=false;

var stage=$('stage');
var renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
var scene=new T.Scene();scene.background=new T.Color(0x1d1946);scene.fog=new T.Fog(0x1d1946,30,70);
var cam=new T.PerspectiveCamera(42,1,.1,120);
scene.add(new T.HemisphereLight(0xdcd6ff,0x3a3278,.95));
var sun=new T.DirectionalLight(0xffffff,.85);sun.position.set(-8,16,10);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);var sc=sun.shadow.camera;var ext=Math.max(lw.w,lw.h)*.75;sc.left=-ext;sc.right=ext;sc.top=ext;sc.bottom=-ext;sc.near=1;sc.far=80;scene.add(sun);

function M(c,r){return new T.MeshStandardMaterial({color:c,roughness:r==null?.45:r,metalness:0})}
function mesh(g,m,x,y,z,sh){var o=new T.Mesh(g,m);o.position.set(x||0,y||0,z||0);o.castShadow=sh!==false;o.receiveShadow=true;return o}
function rbox(w,h,d,c,x,y,z){return mesh(new T.BoxGeometry(w,h,d),M(c,.5),x,y+h/2,z)}
function shade(c,f){var o=new T.Color(c);o.multiplyScalar(f);return o}

/* ---------- floor ---------- */
(function(){
  var S=64,cv=document.createElement('canvas');cv.width=lw.w*S;cv.height=lw.h*S;var g=cv.getContext('2d');
  for(var j=0;j<lw.h;j++)for(var i=0;i<lw.w;i++){
    var ch=lw.floor[j][i];if(ch===' ')continue;var x=i*S,y=j*S,odd=(i+j)%2;
    if(ch==='c'){g.fillStyle=odd?'#9d95e6':'#8f86d8';g.fillRect(x,y,S,S)}
    else if(ch==='g'){g.fillStyle=odd?'#9aa0b8':'#8a90a8';g.fillRect(x,y,S,S);g.strokeStyle='#757b94';g.strokeRect(x+1,y+1,S-2,S-2)}
    else if(ch==='w'){g.fillStyle=odd?'#c58f52':'#b9834a';g.fillRect(x,y,S,S);g.fillStyle='rgba(0,0,0,.18)';for(var k=0;k<4;k++)g.fillRect(x,y+k*16,S,2);g.fillRect(x+(odd?20:44),y,2,S)}
    else if(ch==='r'){g.fillStyle=odd?'#ff8fc2':'#ff7eb6';g.fillRect(x,y,S,S)}
    else if(ch==='u'){g.fillStyle=odd?'#6a5bc4':'#5d4fb3';g.fillRect(x,y,S,S)}
  }
  var tex=new T.CanvasTexture(cv);tex.anisotropy=4;
  var fl=new T.Mesh(new T.PlaneGeometry(lw.w,lw.h),new T.MeshStandardMaterial({map:tex,roughness:.75,alphaTest:.5,transparent:false}));
  fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;scene.add(fl);
})();

/* ---------- walls (generated from the floor edge) ---------- */
var walls=[];
(function(){
  var dirs=[[0,-1],[0,1],[-1,0],[1,0]],WH=4.2;
  for(var j=0;j<lw.h;j++)for(var i=0;i<lw.w;i++){
    if(lw.floor[j][i]===' ')continue;
    dirs.forEach(function(d){
      var ni=i+d[0],nj=j+d[1];
      if(ni>=0&&nj>=0&&ni<lw.w&&nj<lw.h&&lw.floor[nj][ni]!==' ')return;
      var horiz=d[1]!==0,len=horiz?1.4:1,th=.4;
      var g=new T.BoxGeometry(horiz?len:th,1,horiz?th:len);g.translate(0,.5,0);
      var w=new T.Mesh(g,M(horiz?0x3a3278:0x32296b,.7));w.receiveShadow=true;w.castShadow=true;
      w.position.set(i+.5-lw.ox+d[0]*(.5+th/2),0,j+.5-lw.oz+d[1]*(.5+th/2));w.scale.y=WH;scene.add(w);
      walls.push({m:w,nx:d[0],nz:d[1],s:WH,full:WH});
    });
  }
})();

/* ---------- announcement board texture ---------- */
var COL={gold:'#ffd166',mint:'#9fe8d6',pink:'#ffc2dd'};
function boardTexture(){
  var c=document.createElement('canvas');c.width=512;c.height=256;var b=c.getContext('2d');
  b.fillStyle='#f2e3c4';b.fillRect(0,0,512,256);b.fillStyle='#3b3478';b.font='800 34px sans-serif';b.fillText('ANNOUNCEMENTS',22,50);
  news.slice(0,3).forEach(function(n,i){var x=24+i*160;b.fillStyle=COL[n.color]||COL.gold;b.fillRect(x,72,148,160);b.fillStyle='#3b3478';b.font='700 22px sans-serif';b.fillText(n.title.slice(0,11),x+8,104);b.font='16px sans-serif';
    var words=n.body.split(' '),line='',y=130;words.forEach(function(w){if((line+w).length>14){b.fillText(line,x+8,y);y+=20;line=''}line+=w+' '});if(y<220)b.fillText(line,x+8,y)});
  return new T.CanvasTexture(c);
}
function logoTexture(){
  var c=document.createElement('canvas');c.width=256;c.height=128;var l=c.getContext('2d'),tex=new T.CanvasTexture(c);
  function fallback(){l.fillStyle='#0f0d24';l.fillRect(0,0,256,128);l.strokeStyle='#3ee6c4';l.lineWidth=8;l.strokeRect(6,6,244,116);l.fillStyle='#3ee6c4';l.font='800 40px sans-serif';l.textAlign='center';l.fillText('YOUR LOGO',128,78);tex.needsUpdate=true}
  fallback();
  if(logoUrl){var im=new Image();im.onload=function(){l.fillStyle='#fff';l.fillRect(0,0,256,128);var s=Math.min(240/im.width,112/im.height);l.drawImage(im,128-im.width*s/2,64-im.height*s/2,im.width*s,im.height*s);tex.needsUpdate=true};im.src=logoUrl}
  return tex;
}
var boardTex=boardTexture(),logoTex=logoTexture();

/* ---------- objects ---------- */
var screens=[],wallObjs=[],seats=[],boards=[],deskN=0;
var GLOWS=[0x3ee6c4,0x7aa2ff,0xffb347,0xff7eb6,0xc9b6ff,0xffd166];
lw.objects.forEach(function(o){
  var g=new T.Group();g.position.set(o.x,0,o.z);g.rotation.y=o.rot*Math.PI/2;scene.add(g);
  var type=o.type;
  if(type==='desk'){
    var glow=GLOWS[deskN++%GLOWS.length];
    g.add(rbox(3,.12,1.5,0xf2e3c4,0,.82,0));
    [[-1.3,-.6],[1.3,-.6],[-1.3,.6],[1.3,.6]].forEach(function(p){g.add(rbox(.14,.82,.14,0xa07c48,p[0],0,p[1]))});
    g.add(rbox(1.1,.7,.08,0x2a2550,-.4,1.18,-.4));
    var s=mesh(new T.BoxGeometry(.98,.58,.04),new T.MeshStandardMaterial({color:glow,emissive:glow,emissiveIntensity:.8}),-.4,1.5,-.35,false);g.add(s);screens.push(s);
    g.add(rbox(.12,.35,.12,0x2a2550,-.4,.94,-.4));g.add(rbox(.9,.06,.35,0x3b3478,.5,.94,.3));
    g.add(rbox(.8,.12,.8,glow,-.4,.55,1.45));g.add(rbox(.8,.9,.12,glow,-.4,.6,1.85));g.add(rbox(.12,.55,.12,0x2a2550,-.4,0,1.45));g.add(rbox(.6,.06,.6,0x2a2550,-.4,0,1.45));
    var st=L.seatFor(o);st.n=seats.length+1;seats.push(st);
  }else if(type==='plant'){
    g.add(mesh(new T.CylinderGeometry(.4,.3,.7,16),M(0xc9714a),0,.35,0));
    [[0,1.3,0,.62],[-.4,1,.1,.42],[.4,1,-.1,.42],[0,1.7,.1,.4]].forEach(function(p){g.add(mesh(new T.SphereGeometry(p[3],18,14),M(0x3ddc84,.5),p[0],p[1],p[2]))});
  }else if(type==='sofa'){
    g.add(rbox(3.6,.6,1.3,0xd9558f,0,0,0));g.add(rbox(3.6,.9,.4,0xff9ccb,0,.45,.45));g.add(rbox(.4,.8,1.3,0xff9ccb,-1.9,0,0));g.add(rbox(.4,.8,1.3,0xff9ccb,1.9,0,0));
  }else if(type==='meetingTable'){
    g.add(rbox(4.4,.14,2,0xe9d3a3,0,.9,0));g.add(rbox(.5,.9,.5,0xa97f45,-1.4,0,0));g.add(rbox(.5,.9,.5,0xa97f45,1.4,0,0));
    [-1.4,-.5,.5,1.4].forEach(function(x){g.add(rbox(.6,.05,.42,0xd8d6ee,x,1.04,.2))});
  }else if(type==='glass'){
    g.add(mesh(new T.BoxGeometry(7.6,2.6,.08),new T.MeshPhysicalMaterial({color:0xbfe9ff,transparent:true,opacity:.18,roughness:.1}),0,1.3,0,false));
    g.add(rbox(7.6,.1,.14,0xbfe9ff,0,0,0));g.add(rbox(7.6,.1,.14,0xbfe9ff,0,2.6,0));
  }else{ /* wall mounted: back of the object sits against the wall (local -z) */
    var w=new T.Group();w.position.z=-.4;g.add(w);
    if(type==='board'){var bm=mesh(new T.BoxGeometry(5,2.5,.2),[M(0xc9a46a),M(0xc9a46a),M(0xc9a46a),M(0xc9a46a),new T.MeshStandardMaterial({map:boardTex}),M(0xc9a46a)],0,3.1,0);w.add(bm);boards.push({o:o,g:g})}
    if(type==='logo'){w.add(mesh(new T.BoxGeometry(2.6,1.3,.2),[M(0x222),M(0x222),M(0x222),M(0x222),new T.MeshBasicMaterial({map:logoTex}),M(0x222)],0,3.2,0))}
    if(type==='door'){w.add(rbox(2.2,3.4,.3,0xff7eb6,0,0,0));w.add(rbox(1.7,3,.35,0x3b2a7a,0,0,.02));w.add(mesh(new T.SphereGeometry(.09,16,12),M(0xffd166),.5,1.5,.22))}
    if(type==='window'){w.add(rbox(3,2,.2,0x6c5ce7,0,2,0));w.add(mesh(new T.BoxGeometry(2.6,1.6,.22),new T.MeshStandardMaterial({color:0x88d4ff,emissive:0x3a7fb0,emissiveIntensity:.5}),0,3,0,false))}
    if(type==='screen'){w.add(rbox(3.2,1.7,.12,0x15122e,0,1.45,0));w.add(mesh(new T.BoxGeometry(2.9,1.4,.05),new T.MeshStandardMaterial({color:0x7aa2ff,emissive:0x3a5ad0,emissiveIntensity:.6}),0,2.3,.08,false))}
    var th=o.rot*Math.PI/2;wallObjs.push({g:g,nx:-Math.sin(th),nz:-Math.cos(th)});
  }
});

/* ---------- name tags and jelly characters ---------- */
var ROLE={'Tester':'#ffb347','CCO':'#ff7eb6','Web Developer':'#3ee6c4','Application Developer':'#7aa2ff','CEO':'#ffd166','Designer':'#ff9d6c','HR':'#9fe8d6','Support':'#8fd3ff'};
function tag(name,role,bot){
  var label=bot?role+' · BOT':role;
  var c=document.createElement('canvas');c.width=640;c.height=96;var g=c.getContext('2d');
  g.font='800 34px sans-serif';var rw=g.measureText(label).width+28;g.font='800 40px sans-serif';var nw=g.measureText(name).width+28,w=rw+nw+16,x0=(640-w)/2;
  function rr(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h);g.fill()}
  g.fillStyle='rgba(15,13,36,.9)';rr(x0,10,w,76,38);
  g.fillStyle=ROLE[role]||'#c9b6ff';rr(x0+8,18,rw,60,30);
  g.fillStyle='#0f0d24';g.font='800 34px sans-serif';g.textBaseline='middle';g.fillText(label,x0+22,50);
  g.fillStyle='#f3f0ff';g.font='800 40px sans-serif';g.fillText(name,x0+rw+22,52);
  var s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),depthTest:false,transparent:true}));
  s.scale.set(4.2,.63,1);s.renderOrder=10;return s;
}
function jelly(color,costume){
  var root=new T.Group(),mat=M(color,.32);
  var inner=new T.Group();root.add(inner);root.userData={mat:mat,inner:inner,costume:null};
  var body=mesh(new T.SphereGeometry(.62,28,22),mat,0,1.05,0);body.scale.set(.95,1.18,.82);inner.add(body);
  var head=new T.Group();head.position.set(0,2.05,0);inner.add(head);
  head.add(mesh(new T.SphereGeometry(.56,28,22),mat,0,0,0));
  [-1,1].forEach(function(s){head.add(mesh(new T.SphereGeometry(.16,16,12),M(0xffffff,.2),s*.2,.06,.46));head.add(mesh(new T.SphereGeometry(.075,12,10),M(0x1b1535,.2),s*.2,.05,.58,false))});
  var smile=mesh(new T.TorusGeometry(.14,.025,8,16,Math.PI),M(0x1b1535),0,-.16,.52,false);smile.rotation.z=Math.PI;head.add(smile);
  var arms=[];[-1,1].forEach(function(s){var p=new T.Group();p.position.set(s*.68,1.55,0);var a=mesh(new T.SphereGeometry(.2,16,12),mat,0,-.4,0);a.scale.set(.9,2.1,.9);p.add(a);inner.add(p);arms.push(p)});
  var legs=[];[-1,1].forEach(function(s){var p=new T.Group();p.position.set(s*.26,.55,0);var a=mesh(new T.SphereGeometry(.24,16,12),mat,0,-.2,0);a.scale.set(1,1.7,1);p.add(a);inner.add(p);legs.push(p)});
  var shadow=new T.Mesh(new T.CircleGeometry(.7,24),new T.MeshBasicMaterial({color:0,transparent:true,opacity:.28}));shadow.rotation.x=-Math.PI/2;shadow.position.y=.02;root.add(shadow);
  var cost=new T.Group();head.add(cost);
  Object.assign(root.userData,{head:head,arms:arms,legs:legs,cost:cost});
  root.userData.setCostume=function(name){
    while(cost.children.length)cost.remove(cost.children[0]);
    var m2=M(shade(color,.78),.4),hood=function(){var h=mesh(new T.SphereGeometry(.6,24,18,0,Math.PI*2,0,Math.PI*.52),m2,0,.04,-.05);h.rotation.x=-.25;cost.add(h)};
    if(name==='cat'){hood();[-1,1].forEach(function(s){var e=mesh(new T.ConeGeometry(.2,.4,4),m2,s*.34,.62,0);e.rotation.z=-s*.25;cost.add(e)})}
    if(name==='bear'){hood();[-1,1].forEach(function(s){cost.add(mesh(new T.SphereGeometry(.2,14,10),m2,s*.4,.5,-.02))})}
    if(name==='duck'){var bk=mesh(new T.SphereGeometry(.3,16,12),M(0xffa31a,.4),0,-.08,.62);bk.scale.set(1,.45,.7);cost.add(bk);cost.add(mesh(new T.SphereGeometry(.14,10,8),M(0xffd166),0,.6,0))}
    if(name==='robot'){cost.add(mesh(new T.CylinderGeometry(.03,.03,.4,8),M(0xa9a3d6),0,.7,0));cost.add(mesh(new T.SphereGeometry(.1,12,10),new T.MeshStandardMaterial({color:0xff4d6d,emissive:0xff4d6d,emissiveIntensity:.9}),0,.95,0));[-1,1].forEach(function(s){cost.add(mesh(new T.BoxGeometry(.1,.28,.28),M(0xa9a3d6),s*.58,0,0))})}
    if(name==='crown'){cost.add(mesh(new T.CylinderGeometry(.34,.3,.22,5),M(0xffd166,.25),0,.64,0));[0,1,2,3,4].forEach(function(i){var a=i/5*Math.PI*2;cost.add(mesh(new T.ConeGeometry(.08,.18,6),M(0xffd166,.25),Math.sin(a)*.3,.84,Math.cos(a)*.3))})}
    root.userData.costume=name;
  };
  root.userData.setColor=function(c){color=c;mat.color.set(c);root.userData.setCostume(root.userData.costume)};
  root.userData.setCostume(costume);
  return root;
}

var actors={};
function addActor(i){
  if(actors[i.id])return actors[i.id];
  var g=jelly(i.color,i.costume);g.position.set(i.x,0,i.z);g.rotation.y=i.r;scene.add(g);
  var t=tag(i.name,i.role,i.bot);t.position.set(0,3.35,0);g.add(t);
  var a={g:g,id:i.id,bot:!!i.bot,tx:i.x,tz:i.z,tr:i.r,mv:i.mv,seat:i.seat,phase:Math.random()*6,speedBoost:0};actors[i.id]=a;return a;
}
function removeActor(id){var a=actors[id];if(a){scene.remove(a.g);delete actors[id]}}
function countOnline(){var n=0;for(var k in actors)if(!actors[k].bot)n++;$('online').textContent=n+' online';}

/* ---------- me ---------- */
var me=null,seated=null,zoom=null,keys={},yaw=0,typing=false;
var myId=ME.username;

/* ---------- chat ---------- */
var log=$('log'),msg=$('msg');
function addChat(m){var d=document.createElement('div'),em=document.createElement('em');em.style.color=ROLE[m.role]||'#c9b6ff';em.textContent=m.name+': ';d.appendChild(em);d.appendChild(document.createTextNode(m.text));log.appendChild(d);while(log.children.length>20)log.removeChild(log.firstChild);log.scrollTop=log.scrollHeight}
function toast(t){var e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},2500)}
msg.addEventListener('focus',function(){typing=true;for(var k in keys)keys[k]=0});msg.addEventListener('blur',function(){typing=false});
msg.addEventListener('keydown',function(e){e.stopPropagation();if(e.key==='Enter'){var t=msg.value.trim();if(t&&ws&&ws.readyState===1)ws.send(JSON.stringify({t:'chat',text:t}));msg.value='';msg.blur()}else if(e.key==='Escape')msg.blur()});

/* ---------- realtime ---------- */
var ws=null,retry=0,lastSent='',lastSentAt=0;
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onopen=function(){retry=0};
  ws.onmessage=function(ev){var m=JSON.parse(ev.data);
    if(m.t==='init'){
      m.p.forEach(function(p){if(p.id===myId){me=addActor(p);me.g.rotation.y=p.r}else addActor(p)});m.b.forEach(addActor);
      log.innerHTML='';m.chat.forEach(addChat);countOnline();
    }else if(m.t==='join'){addActor(m.p);countOnline()}
    else if(m.t==='leave'){removeActor(m.id);countOnline()}
    else if(m.t==='state'){m.p.concat(m.b).forEach(function(p){var a=actors[p.id];if(!a||a===me)return;a.tx=p.x;a.tz=p.z;a.tr=p.r;a.mv=p.mv;a.seat=p.seat})}
    else if(m.t==='chat')addChat(m.m);
    else if(m.t==='look'){var a=actors[m.id];if(a&&a!==me){a.g.userData.setColor(m.color);a.g.userData.setCostume(m.costume)}}
    else if(m.t==='notice')toast(m.text);
    else if(m.t==='mail'){toast('New mail!');loadMail()}
    else if(m.t==='reload')location.reload();
  };
  ws.onclose=function(e){
    if(e.code===4000){$('online').textContent='Signed in elsewhere';return}
    $('online').textContent='reconnecting...';for(var k in actors)removeActor(k);me=null;
    setTimeout(connect,Math.min(8000,500*Math.pow(2,retry++)));
  };
}
connect();

/* ---------- interaction ---------- */
var pr=$('prompt'),bd=$('board');
function occupied(s){for(var k in actors){var a=actors[k];if(a!==me&&a.seat&&Math.hypot(a.g.position.x-s.x,a.g.position.z-s.z)<.6)return true}return false}
function nearSeat(){if(!me)return null;var P=me.g.position,best=null,d0=2.2;seats.forEach(function(s){var d=Math.hypot(P.x-s.x,P.z-s.z);if(d<d0&&!occupied(s)){d0=d;best=s}});return best}
function nearBoard(){if(!me)return null;var P=me.g.position,best=null,d0=3.4;boards.forEach(function(b){var th=b.o.rot*Math.PI/2,fx=b.g.position.x+Math.sin(th)*1.6,fz=b.g.position.z+Math.cos(th)*1.6,d=Math.hypot(P.x-fx,P.z-fz);if(d<d0){d0=d;best=b}});return best}
function interact(){
  if(!me)return;
  if(zoom){zoom=null;return}
  if(seated){var s=seated,th=s.theta;me.g.position.set(s.x+Math.sin(th)*1.1,0,s.z+Math.cos(th)*1.1);seated=null;return}
  var st=nearSeat();if(st){seated=st;me.g.position.set(st.x,0,st.z);me.g.rotation.y=st.face;return}
  var b=nearBoard();if(b)zoom=b;
}
pr.onclick=interact;
function updatePrompt(){
  var txt=null;if(zoom)txt='Close announcements';else if(seated)txt='Stand up';else{var s=nearSeat();if(s)txt='Sit at Workstation 0'+s.n;else if(nearBoard())txt='Read announcements'}
  pr.hidden=!txt;if(txt)pr.innerHTML='<kbd>F</kbd>'+txt;
  if(!bd.hidden!==!!zoom){bd.hidden=!zoom;if(zoom){var h='';news.forEach(function(n){h+='<article class="'+(COL[n.color]?n.color:'gold')+'"><h3></h3><p></p></article>'});$('boardItems').innerHTML=h;var a=$('boardItems').children;news.forEach(function(n,i){a[i].children[0].textContent=n.title;a[i].children[1].textContent=n.body});if(!news.length)$('boardItems').textContent='Nothing posted yet.'}}
}
[['qL','q'],['eR','e']].forEach(function(p){var b=$(p[0]);b.addEventListener('pointerdown',function(){keys[p[1]]=1});['pointerup','pointerleave','pointercancel'].forEach(function(ev){b.addEventListener(ev,function(){keys[p[1]]=0})})});
addEventListener('keydown',function(e){
  if(typing)return;
  var k=e.key.toLowerCase();
  if(k==='m'&&!e.repeat){setMail(!mailOpen);return}
  if(k==='escape'&&mailOpen){setMail(false);return}
  if(mailOpen)return;
  if(k==='enter'){e.preventDefault();msg.focus();return}
  keys[k]=1;
  if((k==='f'||k===' ')&&!e.repeat){interact();if(k===' ')e.preventDefault()}
  if(k==='escape'&&zoom)zoom=null;
  if(seated&&!zoom&&/^(w|a|s|d|arrow.*)$/.test(k)){var th=seated.theta;me.g.position.set(seated.x+Math.sin(th)*1.1,0,seated.z+Math.cos(th)*1.1);seated=null}
});
addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=0});
addEventListener('blur',function(){keys={}});

function step(a,dx,dz,dt,speed){
  var L2=Math.hypot(dx,dz);if(!L2){a.mv=0;return}
  dx/=L2;dz/=L2;var P=a.g.position,nx=P.x+dx*speed*dt,nz=P.z+dz*speed*dt,ok=false;
  if(!L.blocked(lw,nx,nz)){P.x=nx;P.z=nz;ok=true}else if(!L.blocked(lw,nx,P.z)){P.x=nx;ok=true}else if(!L.blocked(lw,P.x,nz)){P.z=nz;ok=true}
  a.mv=ok?1:0;
  var ang=Math.atan2(dx,dz),cur=a.g.rotation.y,d=Math.atan2(Math.sin(ang-cur),Math.cos(ang-cur));a.g.rotation.y=cur+d*Math.min(1,dt*10);
}

/* ---------- outfit chips ---------- */
var wear=$('wear'),cur={c:ME.costume||'bear',col:ME.color||0x7aa2ff},CAT=ME.catalog;
function owned(kind,v){return kind==='c'?CAT.starterCostumes.indexOf(v)>=0||ME.items.indexOf('costume:'+v)>=0:CAT.starterColors.indexOf(v)>=0||ME.items.indexOf('color:'+v.toString(16).padStart(6,'0'))>=0}
function saveLook(){
  fetch('/api/avatar',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({costume:cur.c,color:cur.col})}).catch(function(){});
  if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'look',costume:cur.c,color:cur.col}));
}
function buildWear(){
  wear.innerHTML='';
  CAT.costumes.forEach(function(n){var b=document.createElement('button'),ok=owned('c',n);b.className='chip';b.type='button';b.textContent=(n==='none'?'Plain':n[0].toUpperCase()+n.slice(1))+(ok?'':' (mail)');b.disabled=!ok;if(!ok)b.title='Arrives by mail';b.setAttribute('aria-pressed',n===cur.c);b.onclick=function(){cur.c=n;if(me)me.g.userData.setCostume(n);buildWear();saveLook()};wear.appendChild(b)});
  CAT.colors.forEach(function(c){var b=document.createElement('button'),ok=owned('k',c);b.className='sw';b.type='button';b.style.background='#'+c.toString(16).padStart(6,'0');b.disabled=!ok;b.setAttribute('aria-label',ok?'Colour':'Colour (arrives by mail)');b.setAttribute('aria-pressed',c===cur.col);b.onclick=function(){cur.col=c;if(me)me.g.userData.setColor(c);buildWear();saveLook()};wear.appendChild(b)});
}
buildWear();

/* ---------- mail ---------- */
var mailOpen=false,mailBox=[],selMail=null,composing=false,users=null;
function setBadge(n){var b=$('badge');b.hidden=!n;b.textContent=n}
function loadMail(){return J('/api/mail').then(function(j){mailBox=j.mail;ME.coins=j.coins;ME.items=j.items;$('coins').textContent=j.coins+' CC';setBadge(j.unread);buildWear();if(mailOpen)renderMail()}).catch(function(){})}
function post(path,body){return fetch('/api/'+path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Failed');return j})})}
function node(tag,props,kids){var e=document.createElement(tag);for(var k in props||{})e[k]=props[k];(kids||[]).forEach(function(c){e.appendChild(typeof c==='string'?document.createTextNode(c):c)});return e}
function attLabel(a){return a.type==='coins'?a.amount+' CC':a.label||a.item}
function renderMail(){
  var list=$('mailList');list.innerHTML='';
  if(!mailBox.length)list.appendChild(node('small',{textContent:'No mail yet.'}));
  mailBox.forEach(function(m){var b=node('button',{type:'button',className:(m.read?'':'unread ')+(selMail===m.id&&!composing?'sel':'')},[node('b',{textContent:m.subject}),node('small',{textContent:m.from+(m.attachment&&!m.claimed?' \u00b7 attachment':'')})]);b.onclick=function(){composing=false;selMail=m.id;if(!m.read){m.read=true;post('mail/read',{id:m.id}).then(loadMail)}renderMail()};list.appendChild(b)});
  var box=$('mailRead');box.innerHTML='';
  if(composing)return renderCompose(box);
  var m=mailBox.find(function(x){return x.id===selMail});
  if(!m){box.appendChild(node('p',{textContent:'Coins and new outfits only arrive here. Pick a message to read it.'}));return}
  box.appendChild(node('small',{textContent:'FROM '+m.from+' \u00b7 '+new Date(m.at).toLocaleString()}));
  box.appendChild(node('h3',{textContent:m.subject}));
  if(m.body)box.appendChild(node('p',{textContent:m.body}));
  if(m.attachment){
    var claim=node('button',{type:'button',className:'chip',textContent:m.claimed?'Claimed':'Claim',disabled:!!m.claimed});
    claim.onclick=function(){claim.disabled=true;post('mail/claim',{id:m.id}).then(function(j){toast('Claimed '+attLabel(m.attachment));loadMail()}).catch(function(e){toast(e.message);loadMail()})};
    box.appendChild(node('div',{className:'att'},[node('b',{textContent:attLabel(m.attachment)}),node('span',{textContent:m.attachment.type==='coins'?'Cyber Coins':'Outfit'}),claim]));
    claim.style.marginLeft='auto';
  }
  var del=node('button',{type:'button',className:'chip',textContent:'Delete'});del.onclick=function(){post('mail/delete',{id:m.id}).then(function(){selMail=null;loadMail()}).catch(function(e){toast(e.message)})};
  box.appendChild(node('div',{className:'row'},[del]));
}
function renderCompose(box){
  var to=node('select',{id:'mTo',ariaLabel:'To'}),subj=node('input',{id:'mSubj',maxLength:80,placeholder:'Subject'}),body=node('textarea',{id:'mBody',rows:6,maxLength:1000,placeholder:'Message'}),send=node('button',{type:'button',className:'chip',textContent:'Send'});
  (users||[]).forEach(function(u){if(u.username!==ME.username)to.appendChild(node('option',{value:u.username,textContent:u.name+' ('+u.role+')'}))});
  send.onclick=function(){post('mail/send',{to:to.value,subject:subj.value,body:body.value}).then(function(){toast('Sent');composing=false;renderMail()}).catch(function(e){toast(e.message)})};
  box.appendChild(node('h3',{textContent:'New message'}));box.appendChild(to);box.appendChild(subj);box.appendChild(body);box.appendChild(node('div',{className:'row'},[send]));
}
function setMail(open){mailOpen=open;$('mail').hidden=!open;if(open){for(var k in keys)keys[k]=0;loadMail()}}
$('mailBtn').onclick=function(){setMail(!mailOpen)};$('mailClose').onclick=function(){setMail(false)};
$('mailWrite').onclick=function(){composing=true;(users?Promise.resolve():J('/api/users').then(function(j){users=j.users})).then(renderMail)};
loadMail();

/* ---------- touch joystick ---------- */
var joy={x:0,z:0},joyEl=$('joy'),knob=$('joyKnob');
function joyMove(e){var r=joyEl.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width/2),z=(e.clientY-r.top-r.height/2)/(r.height/2),l=Math.hypot(x,z);if(l>1){x/=l;z/=l}joy.x=Math.abs(x)<.2?0:x;joy.z=Math.abs(z)<.2?0:z;knob.style.transform='translate('+x*35+'px,'+z*35+'px)'}
joyEl.addEventListener('pointerdown',function(e){joyEl.setPointerCapture(e.pointerId);joyMove(e)});joyEl.addEventListener('pointermove',function(e){if(e.buttons||e.pressure)joyMove(e)});
['pointerup','pointercancel'].forEach(function(ev){joyEl.addEventListener(ev,function(){joy.x=0;joy.z=0;knob.style.transform=''})});

function resize(){var w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ---------- main loop ---------- */
var clock=new T.Clock(),camPos=new T.Vector3(0,12.5,16),look=new T.Vector3(0,1,0),camSet=false;
function frame(){
  var dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(me&&!camSet){camPos.set(me.g.position.x,12.5,me.g.position.z+16);look.set(me.g.position.x,1,me.g.position.z);camSet=true}
  if(!zoom&&!seated)yaw+=((keys.e?1:0)-(keys.q?1:0))*dt*1.9;
  var cs=Math.cos(yaw),sn=Math.sin(yaw);
  if(me){
    var dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,dz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.z;
    if(seated||zoom){me.mv=0}else step(me,cs*dx+sn*dz,-sn*dx+cs*dz,dt,3.6);
    me.seat=seated?1:0;
    var P=me.g.position,key=P.x.toFixed(2)+','+P.z.toFixed(2)+','+me.g.rotation.y.toFixed(2)+','+me.seat+me.mv,now=performance.now();
    if(ws&&ws.readyState===1&&(key!==lastSent&&now-lastSentAt>90||now-lastSentAt>1500)){ws.send(JSON.stringify({t:'pose',x:+P.x.toFixed(2),z:+P.z.toFixed(2),r:+me.g.rotation.y.toFixed(2),seat:me.seat,mv:me.mv}));lastSent=key;lastSentAt=now}
  }
  for(var id in actors){
    var a=actors[id],u=a.g.userData,sit=!!a.seat;
    if(a!==me){var k=Math.min(1,dt*10),P2=a.g.position;P2.x+=(a.tx-P2.x)*k;P2.z+=(a.tz-P2.z)*k;var dr=Math.atan2(Math.sin(a.tr-a.g.rotation.y),Math.cos(a.tr-a.g.rotation.y));a.g.rotation.y+=dr*k}
    var mv=a.mv&&!sit,w=mv?Math.sin(t*10+a.phase):0,bob=Math.sin(t*(mv?10:2)+a.phase);
    u.inner.position.y=sit?-.3:Math.abs(bob)*(mv?.12:.025);
    u.inner.scale.set(1+bob*.025,1-bob*.03,1);
    u.arms[0].rotation.x=sit?-.9:w*.8;u.arms[1].rotation.x=sit?-.9:-w*.8;u.legs[0].rotation.x=sit?-1.45:-w*.7;u.legs[1].rotation.x=sit?-1.45:w*.7;
    u.arms[0].rotation.z=.12+Math.sin(t*2+a.phase)*.03;u.arms[1].rotation.z=-.12-Math.sin(t*2+a.phase)*.03;
    u.head.rotation.z=Math.sin(t*(mv?10:1.5)+a.phase)*.04;
  }
  screens.forEach(function(s,i){s.material.emissiveIntensity=.7+Math.sin(t*2+i)*.12});
  if(me){
    var Q=me.g.position,want=new T.Vector3(Q.x*.9+Math.sin(yaw)*15,12.5,Q.z*.9+Math.cos(yaw)*15),lk=new T.Vector3(Q.x*.9,1,Q.z*.9);
    if(zoom){var th=zoom.o.rot*Math.PI/2,bp=zoom.g.position;want.set(bp.x+Math.sin(th)*4.8,3.2,bp.z+Math.cos(th)*4.8);lk.set(bp.x-Math.sin(th)*.4,3.1,bp.z-Math.cos(th)*.4)}
    else if(seated){var sh=seated.theta;want.set(Q.x*.9+Math.sin(sh)*8,7,Q.z*.9+Math.cos(sh)*8);lk.set(Q.x,1.2,Q.z)}
    camPos.lerp(want,Math.min(1,dt*(zoom?4:3)));cam.position.copy(camPos);look.lerp(lk,Math.min(1,dt*4));cam.lookAt(look);
    /* walls between the camera and the room drop low so the room stays visible */
    var vx=camPos.x-look.x,vz=camPos.z-look.z,vl=Math.hypot(vx,vz)||1;vx/=vl;vz/=vl;
    walls.forEach(function(w){var hide=!zoom&&(w.nx*vx+w.nz*vz)>.25;var target=hide?.35:w.full;w.s+=(target-w.s)*Math.min(1,dt*6);w.m.scale.y=w.s});
    wallObjs.forEach(function(o){o.g.visible=!(!zoom&&(o.nx*vx+o.nz*vz)>.25)});
    updatePrompt();
  }
  renderer.render(scene,cam);requestAnimationFrame(frame);
}
frame();
}
})();
</script>
